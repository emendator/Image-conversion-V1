# ============================================================
# 图片转换工具 - Nginx 站点配置
# 部署位置: /etc/nginx/sites-available/image-conversion
#
# 说明：
#   1) 默认监听 80，deploy.sh 会自动替换为指定端口（如 8084）。
#   2) 前端为 React SPA（Vite 构建到 frontend/dist）。
#   3) 后端 FastAPI 监听 127.0.0.1:8003，这里把 /api、/uploads、
#      /style-images、/slice-images、/output 反代到后端。
#   4) 修改后执行: nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name _;

    # 上传/下载文件大小上限（图片可能较大）
    client_max_body_size 100m;

    # 前端静态文件（Vite 构建产物）
    root /opt/image-conversion/frontend/dist;
    index index.html;

    # 前端页面与静态资源（SPA 兜底到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传大文件、AI 生成耗时较长，放宽超时
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 用户上传/输出图片（后端静态挂载）
    location /uploads/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /output/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 模板图（电商主图 / 营销切片）
    location /style-images/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /slice-images/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
